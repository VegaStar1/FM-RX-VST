<h2>FM RX — 8-station FM band receiver</h2>
<p>This installs the <b>FM RX</b> VST3 plug-in by NUWMUN.</p>
<p>The plug-in goes to <code>/Library/Audio/Plug-Ins/VST3/FM RX.vst3</code>,<br>
the PDF manuals to <code>/Library/Application Support/NUWMUN/FM RX</code>.</p>
<p>Works on Apple Silicon and Intel Macs, macOS 10.13 or later.</p></body></html>
