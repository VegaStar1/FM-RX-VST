<h2>FM RX — 8-станционный FM-приёмник</h2>
<p>Будет установлен VST3-плагин <b>FM RX</b> от NUWMUN.</p>
<p>Плагин — в <code>/Library/Audio/Plug-Ins/VST3/FM RX.vst3</code>,<br>
PDF-инструкции — в <code>/Library/Application Support/NUWMUN/FM RX</code>.</p>
<p>Работает на Mac с Apple Silicon и Intel, macOS 10.13 и новее.</p></body></html>
